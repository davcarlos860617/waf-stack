[SERVICE]
    Flush         1
    Log_Level     info
    # Endpoint de salud (solo dentro de la red de Docker)
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

# -----------------------------------------------------------------------------
# Entrada: Docker envía aquí la salida de los contenedores que usan el
# driver de logging "fluentd" (bunkerweb y bw-scheduler).
# Cada registro llega con: log, container_name, container_id, source
# -----------------------------------------------------------------------------
[INPUT]
    Name          forward
    Listen        0.0.0.0
    Port          24224

# -----------------------------------------------------------------------------
# Clasifica cada línea (ver clasificar.lua). El registro queda así:
#   log        -> la línea original
#   contenedor -> waf-bunkerweb, waf-scheduler...
#   tipo       -> waf | proteccion | acceso | sistema
# -----------------------------------------------------------------------------
[FILTER]
    Name          lua
    Match         docker.*
    Script        /fluent-bit/etc/clasificar.lua
    Call          clasificar

# -----------------------------------------------------------------------------
# Salida: Loki (stack de reportería). Host y puerto vienen del .env del WAF.
#   - "contenedor" y "tipo" se convierten en etiquetas (para filtrar rápido)
#   - en Loki se guarda solo la línea original, sin envoltorio JSON
# -----------------------------------------------------------------------------
[OUTPUT]
    Name             loki
    Match            docker.*
    Host             ${LOKI_HOST}
    Port             ${LOKI_PORT}
    Labels           job=waf
    Label_keys       $contenedor,$tipo
    Remove_keys      contenedor,tipo
    Line_format      json
    Drop_single_key  raw
    Retry_Limit      False
